# Manifest for the flxgdx CLI. Install this extension with:
#   flxgdx add library --repo flixelgdx/flixelgdx-ktx
schema: 1

# Every artifact below is published under this Maven group.
group: org.flixelgdx

# Release tags look like v0.7.2, and the artifact version is 0.7.2.
version-from-tag: strip-v

packages:
  - name: flixelgdx-ktx
    kind: library
    description: Kotlin extensions for FlixelGDX, providing idiomatic Kotlin APIs over the core framework.
    # Only Kotlin games can use this extension.
    requires:
      language: kotlin
    modules:
      core:
        libraries:
          - artifact: flixelgdx-ktx-core
          # The UI bindings are added only while FlixelGDX UI is installed.
          - artifact: flixelgdx-ktx-ui
            if-installed: flixelgdx/flixelgdx-ui
